name: Deploy Ta Cukrárna to VPS

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

env:
  IS_TRUSTED_EVENT: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock

jobs:
  ci:
    name: Validate, Build and Test
    runs-on: self-hosted
    environment: production
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies
        run: |
          npm config set update-notifier false
          npm ci

      - name: Run security scan
        run: npm run lint:secrets

      - name: Run ESLint
        run: npm run lint

      - name: Run HTML validation
        run: npm run lint:html

      - name: Run Markdown lint
        run: npm run lint:md

      - name: Check formatting
        run: npm run format:check

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Build application
        env:
          NEXT_PUBLIC_CLARITY_ID: ${{ secrets.NEXT_PUBLIC_CLARITY_ID }}
          NEXT_PUBLIC_USE_ADMIN: ${{ vars.USE_ADMIN }}
          NEXT_PUBLIC_USE_CHATBOT: ${{ vars.USE_CHATBOT }}
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ta-cukrarna-build
          path: |
            out/
            package.json
            package-lock.json
          retention-days: 1

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: self-hosted
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ta-cukrarna-build

      - name: Setup SSH agent
        run: |
          eval $(ssh-agent -a $SSH_AUTH_SOCK)
          ssh-add - <<< "${{ secrets.VPS_SSH_KEY }}"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock

      - name: Diagnostic - Verify Secrets (Secure)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          echo "🔍 Diagnostic check for VPS secrets..."
          if [ -z "$VPS_HOST" ]; then echo "❌ VPS_HOST is MISSING"; else echo "✅ VPS_HOST is present (length: ${#VPS_HOST})"; fi
          if [ -z "$VPS_USER" ]; then echo "❌ VPS_USER is MISSING"; else echo "✅ VPS_USER is present (length: ${#VPS_USER})"; fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then echo "❌ VPS_SSH_KEY is MISSING"; else echo "✅ VPS_SSH_KEY is present"; fi

      - name: Add server to known hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          echo "🔑 Adding server to known hosts..."
          mkdir -p ~/.ssh
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
          echo "Host keys added for $VPS_HOST"

      - name: Create backup on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          echo "🚀 Starting static deployment to VPS..."
          echo "📦 Creating backup..."
          ssh $VPS_USER@$VPS_HOST 'cp -r ./apps/website ./backups/website-backup-$(date +%Y%m%d-%H%M%S)'

      - name: Deploy to VPS
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          echo "🚀 Starting static deployment to VPS..."
          echo "📤 Deploying static files to ~/apps/website..."
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" --exclude-from='.rsyncignore' ./out/ $VPS_USER@$VPS_HOST:apps/website/
          echo "Setting proper file permissions..."
          # Runtime state (api/DB/*, opening-hours.jsonc) is written by PHP as
          # www-data; sweeping it 644 re-breaks PHP write access, and
          # chmod/chown on www-data-owned files is EPERM for the deploy user.
          # Leave those files alone and never fail the deploy over them.
          ssh $VPS_USER@$VPS_HOST "find ./apps/website -type f -not -path '*/api/DB/*' -not -name 'opening-hours.jsonc' -exec chmod 644 {} \; 2>/dev/null || true"
          ssh $VPS_USER@$VPS_HOST "chown -R ${VPS_USER}:www-data ./apps/website 2>/dev/null || true"
          echo "Static deployment completed successfully!"
          echo "🎉 Static deployment finished!"

      - name: Ensure DB directory exists with correct permissions
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh $VPS_USER@$VPS_HOST "mkdir -p ./apps/website/api/DB && chown "${VPS_USER}:www-data" ./apps/website/api/DB && chmod 2775 ./apps/website/api/DB"

      - name: Initialize SQLite database
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh $VPS_USER@$VPS_HOST "php ./apps/website/api/DB/init.php"

      - name: Fix runtime file permissions
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          # Runtime files (opening-hours.jsonc, api-debug.log) may not exist
          # on a fresh VPS and are otherwise written by PHP as www-data, so
          # every deploy: create them if missing, align the group and keep
          # them group-writable for PHP. The docroot DIRECTORY must be
          # group-writable too - the opening-hours atomic save creates a tmp
          # file and renames it there (PHP runs as www-data). passkeys.sqlite
          # is only chmod'd (it is created by init.php above).
          # NOTE: PHP picks up file changes via opcache timestamp
          # revalidation (default validate_timestamps=1); if a server ever
          # sets it to 0, a root-only `systemctl reload php*-fpm` step must
          # be added back - the deploy user cannot run systemctl.
          ssh $VPS_USER@$VPS_HOST "touch ./apps/website/opening-hours.jsonc ./apps/website/api/DB/api-debug.log; chgrp www-data ./apps/website/opening-hours.jsonc ./apps/website/api/DB/api-debug.log ./apps/website/api/DB/passkeys.sqlite 2>/dev/null; chmod g+w ./apps/website/opening-hours.jsonc ./apps/website/api/DB/api-debug.log ./apps/website/api/DB/passkeys.sqlite 2>/dev/null; chmod g+w ./apps/website; true"

      - name: Cleanup SSH agent
        if: always()
        run: |
          if [ -n "$SSH_AGENT_PID" ]; then
            kill $SSH_AGENT_PID || true
          fi

  verify:
    name: Verify Deployment
    needs: deploy
    runs-on: self-hosted
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Wait for deployment stabilization
        run: |
          echo "⏳ Waiting 30 seconds for deployment to stabilize..."
          sleep 30

      - name: Run deployment verification
        run: ./scripts/verify-deployment.sh

  cleanup:
    name: Cleanup
    needs: [deploy, verify]
    runs-on: self-hosted
    if: always() && startsWith(github.ref, 'refs/tags/v')
    permissions: {}

    steps:
      - name: Finalize
        run: echo "Deployment process finished."
